<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#eef1f4"/>
  <!-- 赤い太陽 -->
  <g stroke="#ff3b30" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="270" cy="40" r="15"/>
    <path d="M270 16 v-7 M270 71 v7 M294 40 h7 M239 40 h7 M287 23 l5 -5 M248 62 l5 -5 M287 57 l5 5 M248 18 l5 5"/>
  </g>
  <!-- 遠景ビル（グレー） -->
  <g fill="#cfd3d8">
    <rect x="10" y="120" width="34" height="60"/><rect x="60" y="100" width="26" height="80"/>
    <rect x="150" y="110" width="30" height="70"/><rect x="210" y="95" width="28" height="85"/>
  </g>
  <!-- ビル群（黒）＋窓 -->
  <g fill="#111">
    <rect x="0" y="150" width="90" height="50"/>
    <rect x="120" y="135" width="80" height="65"/>
    <rect x="250" y="155" width="70" height="45"/>
  </g>
  <g fill="#fff">
    <rect x="14" y="162" width="8" height="11"/><rect x="34" y="162" width="8" height="11"/><rect x="54" y="162" width="8" height="11"/>
    <rect x="134" y="150" width="8" height="11"/><rect x="158" y="150" width="8" height="11"/><rect x="182" y="150" width="8" height="11"/>
    <rect x="134" y="172" width="8" height="11"/><rect x="182" y="172" width="8" height="11"/>
    <rect x="264" y="168" width="8" height="11"/><rect x="288" y="168" width="8" height="11"/>
  </g>
  <!-- 自転車＋ライダー（黒・白ハロー） -->
  <g transform="translate(104 128)" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="-14" cy="12" r="13" fill="#fff"/><circle cx="15" cy="12" r="13" fill="#fff"/>
    <circle cx="-14" cy="12" r="12" fill="none" stroke="#111" stroke-width="4"/>
    <circle cx="15" cy="12" r="12" fill="none" stroke="#111" stroke-width="4"/>
    <path d="M-14 12 L2 -2 L15 12 M2 -2 L6 12 L-14 12 M15 12 L18 -6 M2 -2 L6 -20 L18 -6" fill="none" stroke="#fff" stroke-width="9"/>
    <path d="M-14 12 L2 -2 L15 12 M2 -2 L6 12 L-14 12 M15 12 L18 -6 M2 -2 L6 -20 L18 -6" fill="none" stroke="#111" stroke-width="5"/>
    <circle cx="6" cy="-26" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
    <path d="M-1.5 -28 a8.5 8.5 0 0 1 15 0 z" fill="#111"/>
  </g>
  <!-- ロゴ -->
  <text x="160" y="34" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="#111">ビル層</text>
</svg>
